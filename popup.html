<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>YouTube Music Manager – Settings</title>
        <link rel="stylesheet" href="popup.css" />
    </head>
    <body>
        <div class="popup-header">
            <img
                src="icon.png"
                alt="YouTube Music Manager Icon"
                class="popup-logo"
            />
            <span class="popup-title">YouTube Music Manager</span>
        </div>
        <div class="divider"></div>
            <div class="divider divider-section"></div>
            <div class="slider-container auto-pause-row">
                <label class="switch">
                    <input type="checkbox" id="workerToggle" />
                    <span class="slider"></span>
                </label>
                <span id="status">Auto-Pause Manager: OFF</span>
            </div>
        </div>
        <div class="popup-footer">
            <div class="footer-left">
                <span class="footer-year">©2025</span>
                <span class="footer-brand">YouTube Music Manager</span>
            </div>
            <div class="footer-right">
                <span class="footer-version">v1.2.0</span>
                <a
                    href="https://xsiadron.com/"
                    class="footer-link"
                    target="_blank"
                    rel="noopener"
                    >xsiadron.com</a
                >
            </div>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
